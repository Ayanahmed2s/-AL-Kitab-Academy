kind = "web"
previewPath = "/"
title = "Madrasa & Tuitions Management System"
version = "1.0.0"
id = "artifacts/madrasa-mgmt"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18319

[services.development]
run = "pnpm --filter @workspace/madrasa-mgmt run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/madrasa-mgmt", "run", "build" ]
publicDir = "artifacts/madrasa-mgmt/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18319"
BASE_PATH = "/"
